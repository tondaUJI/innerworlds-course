<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InnerWorlds Mental Health Platform</title>
<meta name="description" content="A digital learning environment promoting mental health literacy, emotional well-being and resilience for children, adolescents, educators and families.">
<style>
:root{--red:#d3321d;--pink:#efa798;--blue:#00689a;--navy:#003549;--cream:#f8e9c0;--ink:#1a1a18;--bg:#fffdf8;--card:#fff;--muted:#5b5b55;--line:#e8e2d0}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#f3efe4;--muted:#b5b2a6;--line:#2f333b;--cream:#2a2820}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
header img{height:44px;display:block}
nav a{margin-left:18px;text-decoration:none;font-weight:600;color:var(--ink)}
nav a:hover{color:var(--red)}
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:0 0 16px}
.hero h1 em{color:var(--red);font-style:normal}
.hero img{width:100%;max-width:420px;justify-self:center}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;margin:6px 8px 0 0}
.btn.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
section{padding:40px 0}
h2{font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0 0 8px}
.lead{color:var(--muted);max-width:720px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.zone{border-radius:16px;padding:18px;color:#111}
.zone b{display:block;font-size:1.1rem}
.g{background:#a9dfb5}.y{background:#f7e08a}.r{background:#f4a79b}
.fmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.fmt div{background:var(--cream);border-radius:16px;padding:18px}
.fmt strong{display:block;color:var(--red);margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.tabs button{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:2px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--blue);color:#fff}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;border-top:6px solid var(--blue)}
.mod:nth-child(3n+1){border-top-color:var(--red)}.mod:nth-child(3n+2){border-top-color:var(--pink)}
.num{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--red)}
.mod h3{margin:2px 0 4px;font-size:1.2rem;line-height:1.25}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.mod p{margin:0 0 10px;font-size:.95rem}
.msg{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:.92rem}
.aud{margin-top:auto;padding-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:.92rem}
.row span{font-weight:600}
.row a{margin-left:8px;font-weight:600;white-space:nowrap}
.soon{color:var(--muted);font-style:italic;font-size:.9rem}
.final{background:var(--navy);color:#fff;border-radius:22px;padding:32px;text-align:center}
.final .btn{background:var(--cream);color:var(--navy)}
footer{padding:32px 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.lang{margin-left:18px}.lang button{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);padding:3px 8px;cursor:pointer}.lang button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.zones{grid-template-columns:1fr}nav a{margin-left:10px;font-size:.9rem}}
</style>
</head>
<body>
<header><div class="wrap"><a href="#top"><img src="logo.webp" alt="InnerWorlds"></a>
<nav><a href="#about" data-i="nav1"></a><a href="#modules" data-i="nav2"></a><a href="#check" data-i="nav3"></a>
<span class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="ca">CA</button></span></nav></div></header>

<main id="top">
<div class="wrap">
<div class="hero">
  <div>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <a class="btn" href="#modules" data-i="b1"></a><a class="btn alt" href="#about" data-i="b2"></a>
  </div>
  <img src="logo.webp" alt="Heart and brain emerging from a phone screen">
</div>
</div>

<section id="about"><div class="wrap">
  <h2 data-i="aboutH"></h2>
  <p class="lead" data-i="aboutP"></p>
  <div class="zones">
    <div class="zone g" data-i="zg"></div>
    <div class="zone y" data-i="zy"></div>
    <div class="zone r" data-i="zr"></div>
  </div>
  <h2 style="margin-top:36px" data-i="fmtH"></h2>
  <div class="fmt">
    <div data-i="f1"></div><div data-i="f2"></div><div data-i="f3"></div><div data-i="f4"></div>
  </div>
</div></section>

<section id="modules"><div class="wrap">
  <h2 data-i="modH"></h2>
  <p class="lead" data-i="modP"></p>
  <div class="tabs" role="group" aria-label="Audience">
    <button data-a="all" aria-pressed="true" data-i="tAll"></button>
    <button data-a="t" aria-pressed="false" data-i="tT"></button>
    <button data-a="a1" aria-pressed="false" data-i="tA1"></button>
    <button data-a="a2" aria-pressed="false" data-i="tA2"></button>
  </div>
  <div class="mods" id="mods"></div>
</div></section>

<section id="check"><div class="wrap">
  <div class="final">
    <h2 data-i="finH"></h2>
    <p data-i="finP"></p>
    <a class="btn" href="https://aulavirtual.uji.es/mod/resource/view.php?id=5997756" data-i="finB"></a>
  </div>
</div></section>
</main>

<footer><div class="wrap" data-i="foot"></div></footer>

<script src="app.js"></script>
</body>
</html>
