<!doctype html>

<head>

<title>InnerWorlds Mental Health Platform</title>
<meta name="description" content="A digital learning environment promoting mental health literacy, emotional well-being and resilience for children, adolescents, educators and families.">
<script>try{var t=localStorage.getItem("iw-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--red:#d3321d;--pink:#efa798;--blue:#00689a;--navy:#003549;--cream:#f8e9c0;--ink:#1a1a18;--bg:#fffdf8;--card:#fff;--muted:#5b5b55;--line:#e8e2d0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2026;--ink:#f3efe4;--muted:#b5b2a6;--line:#2f333b;--cream:#2a2820;--blue:#5bb3e6}}
:root[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#f3efe4;--muted:#b5b2a6;--line:#2f333b;--cream:#2a2820;--blue:#5bb3e6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
header img{height:44px;display:block}
nav a{margin-left:18px;text-decoration:none;font-weight:600;color:var(--ink)}
nav a:hover{color:var(--red)}
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:0 0 16px}
.hero h1 em{color:var(--red);font-style:normal}
.hero img{width:100%;max-width:420px;justify-self:center}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;margin:6px 8px 0 0}
.btn.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
section{padding:40px 0}
h2{font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0 0 8px}
.lead{color:var(--muted);max-width:720px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.zone{border-radius:16px;padding:18px;color:#111}
.zone b{display:block;font-size:1.1rem}
.g{background:#a9dfb5}.y{background:#f7e08a}.r{background:#f4a79b}
.fmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.fmt div{background:var(--cream);border-radius:16px;padding:18px}
.fmt strong{display:block;color:var(--red);margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.tabs button{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:2px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--blue);color:var(--bg)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;border-top:6px solid var(--blue)}
.mod:nth-child(3n+1){border-top-color:var(--red)}.mod:nth-child(3n+2){border-top-color:var(--pink)}
.num{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--red)}
.mod h3{margin:2px 0 4px;font-size:1.2rem;line-height:1.25}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.mod p{margin:0 0 10px;font-size:.95rem}
.msg{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:.92rem}
.aud{margin-top:auto;padding-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:.92rem}
.row span{font-weight:600}
.row a{margin-left:8px;font-weight:600;white-space:nowrap}
.soon{color:var(--muted);font-style:italic;font-size:.9rem}
.final{background:var(--navy);color:#fff;border-radius:22px;padding:32px;text-align:center}
.final .btn{background:var(--cream);color:var(--navy)}
footer{padding:32px 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.lang{margin-left:18px;font:inherit;font-size:.85rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.resource{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--cream);border-radius:18px;padding:24px;margin-top:12px}.resource h3{margin:0 0 6px}.resource p{margin:0 0 6px;max-width:640px}
.qbtn{font:inherit;font-weight:600;color:var(--blue);background:none;border:0;cursor:pointer;padding:0 0 0 8px}.bdg{margin-left:4px;color:#2e8b57}
dialog{border:0;border-radius:18px;max-width:640px;width:calc(100% - 32px);padding:0;background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.dlg{padding:24px;margin:0}.dlg h3{margin:0 0 12px}.dlg label{display:block;margin:10px 0;font-weight:600}.dlg input,.dlg select{display:block;width:100%;font:inherit;padding:8px;margin-top:4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.q{border-top:1px dashed var(--line);padding:12px 0}.q p{margin:0 0 6px;font-weight:600}.q label{display:block;font-weight:400;margin:4px 0;padding:6px 8px;border-radius:8px}.q label.ok{background:#a9dfb5;color:#111}.q label.no{background:#f4a79b;color:#111}.q .why{font-size:.9rem;color:var(--muted);margin:4px 0 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#am{min-height:1.4em;font-size:.92rem}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.pill{background:var(--cream);color:var(--ink);padding:2px 10px;border-radius:999px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);margin:10px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.qt{font-size:.9rem;color:var(--muted);margin:0 0 4px;font-weight:600}
.qq{font-size:1.2rem;font-weight:700;line-height:1.35;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--ink)}
.opt.ok{border-color:#2e8b57;background:#2e8b5722}.opt.no{border-color:var(--red);background:#d3321d22}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--cream);font-size:.95rem}
.res{text-align:center}.res h3{font-size:1.3rem}
.ring{width:120px;height:120px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.res .act{justify-content:center}
.skip{position:absolute;left:-999px;top:0;background:var(--bg);color:var(--ink);padding:8px 12px;z-index:20}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chk{font-weight:400!important;font-size:.9rem}.chk input{display:inline;width:auto;margin:0 6px 0 0}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.help div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.help h3{margin:0 0 8px;font-size:1.05rem}
.help a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:6px 0;border-top:1px dashed var(--line);font-size:.92rem;color:var(--ink)}.help a b{color:var(--red);white-space:nowrap}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
.mod .zones{grid-template-columns:1fr;gap:6px;margin:0 0 10px}.mod .zone{padding:6px 12px;font-size:.88rem}
.mod{border-top:0!important;overflow:hidden;--c:var(--red)}
.mod.c0{--c:#d3321d}.mod.c1{--c:#00689a}.mod.c2{--c:#e0a82e}.mod.c3{--c:#7b5ea7}.mod.c4{--c:#2e8b57}
.mh{display:flex;gap:14px;align-items:center;margin:-20px -20px 12px;padding:16px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--card)),var(--card))}
.ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:var(--card);box-shadow:0 2px 0 var(--c),0 6px 14px #0002}
.mh .num{color:var(--c)}
.chips{margin:0 0 10px}.chips span{display:inline-block;background:color-mix(in srgb,var(--c) 14%,var(--card));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:999px;padding:1px 10px;font-size:.8rem;margin:0 4px 4px 0}
.chips span::first-letter{text-transform:uppercase}
.mod .sum{font-size:.98rem;line-height:1.55}
.mod .msg{border-left:4px solid var(--c);border-radius:0 10px 10px 0}
.fmt div::before{display:block;font-size:1.8rem;margin-bottom:4px}
.fmt div[data-i=f1]::before{content:"🎬"}.fmt div[data-i=f2]::before{content:"📄"}.fmt div[data-i=f3]::before{content:"🧑‍🏫"}.fmt div[data-i=f4]::before{content:"⚡"}
.help h3::before{margin-right:6px}
/* the logo has dark text: give it a light base in dark mode */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) img[src^="logo"]{background:#fffdf8;border-radius:14px;padding:6px}}
:root[data-theme=dark] img[src^="logo"]{background:#fffdf8;border-radius:14px;padding:6px}
.sch{display:grid;gap:6px;margin:0 0 10px}
.sch>div{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-left:5px solid var(--c);border-radius:12px;padding:6px 12px;font-size:.9rem}
.sch .e{font-size:1.25rem;line-height:1.4}.sch b{display:block}.sch small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35}
.sch.steps{counter-reset:s}.sch.steps .e{display:none}
.sch.steps>div::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;margin-top:1px}
.mod.c2 .sch.steps>div::before{color:#111}
.sch.tags{display:flex;flex-wrap:wrap}.sch.tags>div{border-left-width:1px;border-radius:999px;padding:3px 12px;align-items:center}.sch.tags .e{font-size:1rem}
dialog{position:fixed}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--cream);color:var(--ink);font-size:1rem;cursor:pointer;z-index:1}
.x:hover{background:var(--line)}
.dlg h3,.qh{padding-right:36px}
header .wrap{flex-wrap:wrap}nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}nav a{margin-left:0!important;white-space:nowrap}.lang{margin-left:0!important}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ach div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;opacity:.45;filter:grayscale(1)}
.ach div.on{opacity:1;filter:none;background:var(--cream);border-color:var(--red)}
.ach span{font-size:1.6rem;display:block}.ach b{display:block;font-size:.9rem}.ach small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.newach{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--cream);border:2px solid var(--red)}
@media(max-width:760px){header{position:static}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.zones{grid-template-columns:1fr}nav a{margin-left:10px;font-size:.9rem}}
</style>
</head>
